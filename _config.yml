# Welcome to Jekyll!

# Basic Site Settings
locale: "en-US"

title: "Vinod Thale"
remote_theme: mmistakes/minimal-mistakes@4.24.0
title_separator: "-"
name: &name "Dr. Vinod Ashok Thale"
description: &description "CFD researcher in interfacial flows, drop impact dynamics, and thermal simulations."
url: "https://vinodthale.github.io"
baseurl: ""  # No subpath
repository: "vinodthale/vinodthale.github.io"

# Plugins needed for GitHub Pages + AcademicPages
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-gist
  - jekyll-redirect-from
  - jemoji


# Site Author - Sidebar Info
author:
  avatar: "profile.jpg"
  name: "Dr. Vinod A. Thale"
  bio: "Ph.D. in Mechanics | XJTU China"
  location: "IITH, India"
  employer: "Indian institute of technology Hyderabad"
  email: "thalevinod@gmail.com"

  googlescholar: "https://scholar.google.com/citations?user=oZer2BkAAAAJ"
  researchgate: "https://www.researchgate.net/profile/Vinod-lehui-Thale"
  github: "thalevinod"
  linkedin: "thalevinod"
  twitter: "thalevinod"

# Publication Categories
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser: "profile.jpg"
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

comments:
  provider: false

staticman:
  allowedFields: ['name', 'email', 'url', 'message']
  branch: "gh-pages"
  commitMessage: "New comment."
  filename: comment-{@timestamp}
  format: "yml"
  moderation: true
  path: "_data/comments/{options.slug}"
  requiredFields: ['name', 'email', 'message']
  transforms:
    email: "md5"
  generatedFields:
    date:
      type: "date"
      options:
        format: "iso8601"

atom_feed:
  hide: false

# SEO
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:

# Social Sharing Metadata
twitter:
  username: &twitter "thalevinod"
facebook:
  username:
  app_id:
  publisher:
og_image: "profile.jpg"
og_description: "Vinod A. Thale - Computational Fluid Dynamics | Multiphase Flow | Basilisk CFD"

# Structured Data
social:
  type: Person
  name: "Vinod A. Thale"
  links:
    - "https://scholar.google.com/citations?user=oZer2BkAAAAJ"
    - "https://www.researchgate.net/profile/Vinod-lehui-Thale"
    - "https://github.com/thalevinod"
    - "https://www.linkedin.com/in/thalevinod"
    - "https://twitter.com/thalevinod"

# Analytics
analytics:
  provider: false

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: Asia/Kolkata

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development
