# Basic Site Settings
locale: "en-US"
title: "Vinod Thale"
remote_theme: mmistakes/minimal-mistakes@4.24.0
title_separator: "-"
name: &name "Vinod Ashok Thale"
description: &description "CFD researcher in interfacial flows, drop impact dynamics, and thermal simulations."
url: "https://vinodthale.github.io"
baseurl: ""
repository: "vinodthale/vinodthale.github.io"

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-gist
  - jekyll-redirect-from
  - jemoji

# Author Sidebar Info
author:
  avatar: "profile.jpg"
  name: "Vinod Ashok Thale"
  bio: "Ph.D. in Mechanics | XJTU China"
  location: "Hangzhou, China"
  employer: "Zhejiang University"
  googlescholar: "https://scholar.google.com/citations?user=oZer2BkAAAAJ"
  researchgate: "https://www.researchgate.net/profile/Vinod-lehui-Thale"
  github: "vinodthale"
  linkedin: "thalevinod"
  twitter: "thalevinod"

# Site Settings
teaser: "profile.jpg"
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false

# Comments and Feeds
comments:
  provider: false
atom_feed:
  hide: false

# SEO & Social Sharing
og_image: "profile.jpg"
og_description: "Vinod A. Thale - Computational Fluid Dynamics | Multiphase Flow | Basilisk CFD"
twitter:
  username: &twitter "thalevinod"
social:
  type: Person
  name: "Vinod A. Thale"
  links:
    - "https://scholar.google.com/citations?user=oZer2BkAAAAJ"
    - "https://www.researchgate.net/profile/Vinod-lehui-Thale"
    - "https://github.com/vinodthale"
    - "https://www.linkedin.com/in/thalevinod"
    - "https://twitter.com/thalevinod"

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - .github
  - README
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - tmp
  - node_modules
  - "*.sublime-*"
  - log
  - local
  - _site

keep_files:
  - .git
  - .svn

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
incremental: false
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Kramdown Options
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true

# Permalink and Timezone
permalink: /:categories/:title/
timezone: Asia/Kolkata

